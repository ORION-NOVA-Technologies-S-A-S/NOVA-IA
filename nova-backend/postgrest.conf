# PostgREST (instalarlo desde https://postgrest.org). Ajusta los valores entre <>.
db-uri = "postgres://authenticator:<CLAVE>@<HOST>:5432/nova"
db-schemas = "api"                 # solo el esquema api queda expuesto; 'core' nunca
db-anon-role = "web_anon"
jwt-secret = "<SECRETO_DE_32_O_MAS_CARACTERES>"
db-pre-request = ""                # (opcional) validar JWT revocados
server-port = 3000
